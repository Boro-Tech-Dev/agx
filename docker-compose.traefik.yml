# Traefik (Hostinger /docker/traefik-isda) reverse proxy labels.
# Requires Traefik on host network with docker provider; stop Caddy first.
# Usage on VPS:
#   COMPOSE_FILE=docker-compose.vps.yml:docker-compose.traefik.yml docker compose up -d web-dashboard
services:
  web-dashboard:
    ports: []
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.ragtag.rule=Host(`idea-impact.com`) || Host(`www.idea-impact.com`)
      - traefik.http.routers.ragtag.entrypoints=websecure
      - traefik.http.routers.ragtag.tls=true
      - traefik.http.routers.ragtag.tls.certresolver=letsencrypt
      - traefik.http.routers.ragtag.service=ragtag
      - traefik.http.services.ragtag.loadbalancer.server.port=3000
      # Hostinger panel opens the VPS hostname — redirect to canonical domain
      - traefik.http.routers.ragtag-hstgr.rule=Host(`srv1139701.hstgr.cloud`)
      - traefik.http.routers.ragtag-hstgr.entrypoints=websecure
      - traefik.http.routers.ragtag-hstgr.tls=true
      - traefik.http.routers.ragtag-hstgr.tls.certresolver=letsencrypt
      - traefik.http.routers.ragtag-hstgr.middlewares=ragtag-hstgr-redirect
      - traefik.http.middlewares.ragtag-hstgr-redirect.redirectregex.regex=^https://srv1139701\.hstgr\.cloud/(.*)
      - traefik.http.middlewares.ragtag-hstgr-redirect.redirectregex.replacement=https://idea-impact.com/$${1}
      - traefik.http.middlewares.ragtag-hstgr-redirect.redirectregex.permanent=true
  keycloak:
    ports: []
    expose:
      - "8080"
    command:
      - start
      - --http-enabled=true
      - --hostname=https://auth.idea-impact.com
      - --import-realm
    environment:
      KC_HOSTNAME: https://auth.idea-impact.com
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    labels:
      - traefik.enable=true
      - traefik.http.routers.ragtag-auth.rule=Host(`auth.idea-impact.com`)
      - traefik.http.routers.ragtag-auth.entrypoints=websecure
      - traefik.http.routers.ragtag-auth.tls=true
      - traefik.http.routers.ragtag-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.ragtag-auth.service=ragtag-auth
      - traefik.http.services.ragtag-auth.loadbalancer.server.port=8080
      - traefik.http.routers.ragtag-auth.middlewares=ragtag-kc-forwarded@docker
      # Keycloak OIDC on main domain — /realms/* must reach Keycloak, not web-dashboard
      - traefik.http.routers.ragtag-kc-realms.rule=(Host(`idea-impact.com`) || Host(`www.idea-impact.com`)) && PathPrefix(`/realms`)
      - traefik.http.routers.ragtag-kc-realms.entrypoints=websecure
      - traefik.http.routers.ragtag-kc-realms.tls=true
      - traefik.http.routers.ragtag-kc-realms.tls.certresolver=letsencrypt
      - traefik.http.routers.ragtag-kc-realms.priority=100
      - traefik.http.routers.ragtag-kc-realms.service=ragtag-auth
      - traefik.http.routers.ragtag-kc-realms.middlewares=ragtag-kc-forwarded@docker
      - traefik.http.middlewares.ragtag-kc-forwarded.headers.customrequestheaders.X-Forwarded-Proto=https

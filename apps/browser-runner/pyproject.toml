[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-runner"
version = "0.1.0"
description = "Playwright-backed web screenshot, extract, and crawl service"
requires-python = ">=3.11"
dependencies = [
  "playwright==1.49.1",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "httpx==0.28.1",
  "trafilatura==1.12.0",
  "prometheus-client==0.21.0",
  "prometheus-fastapi-instrumentator==7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs Playwright browsers installed (skipped in CI unit job)",
]

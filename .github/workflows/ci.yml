name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-dashboard/package-lock.json
      - run: npm ci
      - run: test -f public/brand/ragtag-stack.webp
      - run: npm run typecheck
      - run: npm run test

  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install shared test deps
        run: pip install pytest httpx pytest-asyncio
      - name: Run Python unit tests
        run: ./scripts/ci-unit-tests.sh

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate base compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate registry overlay
        env:
          IMAGE_TAG: ci-validate
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.registry.yml \
            config --quiet

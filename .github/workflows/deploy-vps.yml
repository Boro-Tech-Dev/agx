name: Deploy VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy existing GHCR tag (e.g. sha-abc...). Leave empty to build and deploy current commit."
        required: false
        type: string
      skip_build:
        description: "Skip image build (requires image_tag)"
        required: false
        type: boolean
        default: false

concurrency:
  group: vps-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      image_tag: ${{ steps.out.outputs.image_tag }}
      deploy_sha: ${{ steps.out.outputs.deploy_sha }}
      should_build: ${{ steps.out.outputs.should_build }}
    steps:
      - id: out
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.skip_build }}" == "true" && -z "${{ inputs.image_tag }}" ]]; then
              echo "::error::skip_build requires image_tag" >&2
              exit 1
            fi
            if [[ -n "${{ inputs.image_tag }}" ]]; then
              echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "image_tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            fi
            echo "deploy_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
            echo "image_tag=sha-${sha}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "deploy_sha=${sha}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      push_floating_main: true
    secrets: inherit
    permissions:
      contents: read
      packages: write

  deploy:
    needs: [resolve, build]
    if: always() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
    steps:
      - name: Configure SSH and deploy target
        env:
          VPS_DOTENV: ${{ secrets.VPS_DOTENV }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_DOTENV//[[:space:]]/}" ]]; then
            echo "::error::VPS_DOTENV secret is required" >&2
            exit 1
          fi
          if [[ -z "${VPS_SSH_PRIVATE_KEY//[[:space:]]/}" ]]; then
            echo "::error::VPS_SSH_PRIVATE_KEY secret is required" >&2
            exit 1
          fi
          printf '%s\n' "$VPS_DOTENV" > .env.vps
          set -a
          # shellcheck disable=SC1091
          source .env.vps
          set +a
          : "${VPS_HOST:?VPS_HOST missing in VPS_DOTENV}"
          : "${VPS_USER:?VPS_USER missing in VPS_DOTENV}"
          DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/agent-x}"
          PUBLIC_URL="${VPS_PUBLIC_URL:-https://idea-impact.com}"
          SSH_PORT="${VPS_SSH_PORT:-22}"
          {
            echo "VPS_HOST=${VPS_HOST}"
            echo "VPS_USER=${VPS_USER}"
            echo "VPS_SSH_PORT=${SSH_PORT}"
            echo "VPS_DEPLOY_PATH=${DEPLOY_PATH}"
            echo "VPS_PUBLIC_URL=${PUBLIC_URL}"
          } >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"
          ssh-keyscan -4 -p "${SSH_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            echo 'Host vps-deploy'
            echo "  HostName ${VPS_HOST}"
            echo "  User ${VPS_USER}"
            echo "  Port ${SSH_PORT}"
            echo '  AddressFamily inet'
            echo '  IdentityFile ~/.ssh/deploy_key'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Verify SSH to VPS
        run: ssh vps-deploy 'echo "SSH OK as $(whoami)@$(hostname)"'

      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.deploy_sha }}

      - name: Sync compose and scripts to VPS
        run: |
          rsync -avz -e ssh \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git' \
            --exclude 'uploads/' \
            --exclude 'artifacts/' \
            --exclude 'workspace/' \
            --exclude 'apps/' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            ./ "vps-deploy:${VPS_DEPLOY_PATH}/"

      - name: Write production .env on VPS
        env:
          VPS_DOTENV: ${{ secrets.VPS_DOTENV }}
        run: |
          printf '%s\n' "$VPS_DOTENV" | ssh vps-deploy \
            "umask 077 && mkdir -p '${VPS_DEPLOY_PATH}' && cat > '${VPS_DEPLOY_PATH}/.env' && chmod 600 '${VPS_DEPLOY_PATH}/.env'"

      - name: Pull images and restart stack on VPS
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          ssh vps-deploy "bash -s" <<REMOTE
          set -euo pipefail
          cd '${VPS_DEPLOY_PATH}'
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          if [[ -n "\${GHCR_READ_TOKEN:-}" && "\${GHCR_READ_TOKEN}" != REPLACE_WITH_* ]]; then
            echo "\${GHCR_READ_TOKEN}" | docker login ghcr.io -u "\${GHCR_USERNAME:-boro-tech-dev}" --password-stdin
          else
            echo "Skipping ghcr.io login (public packages or GHCR_READ_TOKEN unset)"
          fi
          export IMAGE_TAG='${IMAGE_TAG}'
          export COMPOSE_FILE=docker-compose.vps.yml:docker-compose.traefik.yml:docker-compose.registry.yml
          ./scripts/vps-deploy-registry.sh
          REMOTE

      - name: Public health check
        run: |
          base="${VPS_PUBLIC_URL%/}"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "${base}/health"

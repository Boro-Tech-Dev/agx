name: Deploy VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy existing GHCR tag (e.g. sha-abc...). Leave empty to build and deploy current commit."
        required: false
        type: string
      skip_build:
        description: "Skip image build (requires image_tag)"
        required: false
        type: boolean
        default: false

concurrency:
  group: vps-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      image_tag: ${{ steps.out.outputs.image_tag }}
      deploy_sha: ${{ steps.out.outputs.deploy_sha }}
      should_build: ${{ steps.out.outputs.should_build }}
    steps:
      - id: out
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.skip_build }}" == "true" && -z "${{ inputs.image_tag }}" ]]; then
              echo "::error::skip_build requires image_tag" >&2
              exit 1
            fi
            if [[ -n "${{ inputs.image_tag }}" ]]; then
              echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "image_tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            fi
            echo "deploy_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
            echo "image_tag=sha-${sha}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "deploy_sha=${sha}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      push_floating_main: true
    secrets: inherit
    permissions:
      contents: read
      packages: write

  deploy:
    needs: [resolve, build]
    if: always() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.deploy_sha }}

      - name: Configure SSH and deploy target
        env:
          VPS_DOTENV: ${{ secrets.VPS_DOTENV }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_DOTENV//[[:space:]]/}" ]]; then
            echo "::error::VPS_DOTENV secret is required" >&2
            exit 1
          fi
          if [[ -z "${VPS_SSH_PRIVATE_KEY//[[:space:]]/}" ]]; then
            echo "::error::VPS_SSH_PRIVATE_KEY secret is required" >&2
            exit 1
          fi
          printf '%s\n' "$VPS_DOTENV" > .env.vps
          set -a
          # shellcheck disable=SC1091
          source .env.vps
          set +a
          : "${VPS_HOST:?VPS_HOST missing in VPS_DOTENV}"
          : "${VPS_USER:?VPS_USER missing in VPS_DOTENV}"
          DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/agent-x}"
          PUBLIC_URL="${VPS_PUBLIC_URL:-https://idea-impact.com}"
          SSH_PORT="${VPS_SSH_PORT:-22}"
          {
            echo "VPS_HOST=${VPS_HOST}"
            echo "VPS_USER=${VPS_USER}"
            echo "VPS_SSH_PORT=${SSH_PORT}"
            echo "VPS_DEPLOY_PATH=${DEPLOY_PATH}"
            echo "VPS_PUBLIC_URL=${PUBLIC_URL}"
          } >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"
          : > ~/.ssh/known_hosts
          pinned="${GITHUB_WORKSPACE}/infra/vps-deploy-known_hosts"
          if [[ -f "${pinned}" ]]; then
            grep -v '^#' "${pinned}" | grep -q . && cat "${pinned}" >> ~/.ssh/known_hosts
            echo "Loaded pinned host keys from infra/vps-deploy-known_hosts"
          else
            echo "::warning::${pinned} missing; will rely on keyscan or VPS_SSH_KNOWN_HOSTS"
          fi
          if [[ -n "${VPS_SSH_KNOWN_HOSTS//[[:space:]]/}" ]]; then
            printf '%s\n' "${VPS_SSH_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
            echo "Appended VPS_SSH_KNOWN_HOSTS secret"
          fi
          host_in_known_hosts() {
            ssh-keygen -F "[${VPS_HOST}]:${SSH_PORT}" -f ~/.ssh/known_hosts >/dev/null 2>&1 \
              || ssh-keygen -F "${VPS_HOST}" -f ~/.ssh/known_hosts >/dev/null 2>&1
          }
          if ! host_in_known_hosts; then
            echo "::warning::No known_hosts entry for ${VPS_HOST}; fallback ssh-keyscan (stderr visible)"
            keyscan_ok=false
            for attempt in 1 2 3; do
              scan_out="${HOME}/.ssh/keyscan-fallback.txt"
              : > "${scan_out}"
              echo "--- ssh-keyscan -4 attempt ${attempt} ---"
              ssh-keyscan -4 -T 15 -p "${SSH_PORT}" -H "${VPS_HOST}" 2>&1 | tee -a "${scan_out}" || true
              echo "--- ssh-keyscan default attempt ${attempt} ---"
              ssh-keyscan -T 15 -p "${SSH_PORT}" -H "${VPS_HOST}" 2>&1 | tee -a "${scan_out}" || true
              grep -v '^#' "${scan_out}" | grep -q . && grep -v '^#' "${scan_out}" >> ~/.ssh/known_hosts
              if host_in_known_hosts; then
                keyscan_ok=true
                echo "ssh-keyscan fallback succeeded on attempt ${attempt}"
                break
              fi
              echo "::warning::ssh-keyscan fallback attempt ${attempt}/3 produced no usable host key"
              sleep 10
            done
            if [[ "${keyscan_ok}" != "true" ]]; then
              echo "::error::No known_hosts for ${VPS_HOST} after pin + keyscan fallback" >&2
              exit 1
            fi
          else
            echo "Using pinned known_hosts (no keyscan)"
          fi
          {
            echo 'Host vps-deploy'
            echo "  HostName ${VPS_HOST}"
            echo "  User ${VPS_USER}"
            echo "  Port ${SSH_PORT}"
            echo '  IdentityFile ~/.ssh/deploy_key'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
            echo '  ConnectTimeout 30'
            echo '  ConnectionAttempts 3'
            echo '  ServerAliveInterval 15'
            echo '  ServerAliveCountMax 4'
            echo '  TCPKeepAlive yes'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          cat > ~/.ssh/ci-deploy-helpers.sh <<'HELPERS'
          # shellcheck shell=bash
          ssh_with_retry() {
            local max_attempts=5
            local delay=15
            local attempt=1
            local rc=0
            while (( attempt <= max_attempts )); do
              if ssh vps-deploy "$@"; then
                return 0
              fi
              rc=$?
              if (( attempt == max_attempts )); then
                break
              fi
              echo "::warning::SSH attempt ${attempt}/${max_attempts} failed (exit ${rc}); retrying in ${delay}s..."
              sleep "${delay}"
              if (( delay < 120 )); then delay=$((delay * 2)); fi
              ((attempt++))
            done
            echo "::error::SSH failed after ${max_attempts} attempts (last exit ${rc})" >&2
            return "${rc}"
          }
          rsync_with_retry() {
            local max_attempts=5
            local delay=15
            local attempt=1
            local rc=0
            while (( attempt <= max_attempts )); do
              if rsync -avz -e ssh "$@"; then
                return 0
              fi
              rc=$?
              if (( attempt == max_attempts )); then
                break
              fi
              echo "::warning::rsync attempt ${attempt}/${max_attempts} failed (exit ${rc}); retrying in ${delay}s..."
              sleep "${delay}"
              if (( delay < 120 )); then delay=$((delay * 2)); fi
              ((attempt++))
            done
            echo "::error::rsync failed after ${max_attempts} attempts (last exit ${rc})" >&2
            return "${rc}"
          }
          HELPERS
          chmod 600 ~/.ssh/ci-deploy-helpers.sh

      - name: Verify SSH to VPS
        run: |
          # shellcheck source=/dev/null
          source ~/.ssh/ci-deploy-helpers.sh
          ssh_with_retry 'echo "SSH OK as $(whoami)@$(hostname)"'

      - name: Sync compose and scripts to VPS
        run: |
          # shellcheck source=/dev/null
          source ~/.ssh/ci-deploy-helpers.sh
          rsync_with_retry \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git' \
            --exclude 'uploads/' \
            --exclude 'artifacts/' \
            --exclude 'workspace/' \
            --exclude 'apps/' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            ./ "vps-deploy:${VPS_DEPLOY_PATH}/"

      - name: Write production .env on VPS
        env:
          VPS_DOTENV: ${{ secrets.VPS_DOTENV }}
        run: |
          # shellcheck source=/dev/null
          source ~/.ssh/ci-deploy-helpers.sh
          printf '%s\n' "$VPS_DOTENV" | sed 's|^KEYCLOAK_ISSUER=https://idea-impact.com/realms/platform|KEYCLOAK_ISSUER=https://auth.idea-impact.com/realms/platform|' | ssh_with_retry \
            "umask 077 && mkdir -p '${VPS_DEPLOY_PATH}' && cat > '${VPS_DEPLOY_PATH}/.env' && chmod 600 '${VPS_DEPLOY_PATH}/.env'"

      - name: Pull images and restart stack on VPS
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          # shellcheck source=/dev/null
          source ~/.ssh/ci-deploy-helpers.sh
          ssh_with_retry "bash -s" <<REMOTE
          set -euo pipefail
          cd '${VPS_DEPLOY_PATH}'
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          if [[ -n "\${GHCR_READ_TOKEN:-}" && "\${GHCR_READ_TOKEN}" != REPLACE_WITH_* ]]; then
            echo "\${GHCR_READ_TOKEN}" | docker login ghcr.io -u "\${GHCR_USERNAME:-boro-tech-dev}" --password-stdin
          else
            echo "Skipping ghcr.io login (public packages or GHCR_READ_TOKEN unset)"
          fi
          export IMAGE_TAG='${IMAGE_TAG}'
          export COMPOSE_FILE=docker-compose.vps.yml:docker-compose.traefik.yml:docker-compose.registry.yml
          ./scripts/vps-deploy-registry.sh
          REMOTE

      - name: Public health check
        run: |
          base="${VPS_PUBLIC_URL%/}"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "${base}/health"

      - name: Verify OIDC auth (HTTPS issuer, no http form POST)
        run: |
          base="${VPS_PUBLIC_URL:-https://idea-impact.com}"
          chmod +x ./scripts/verify-landing-auth.sh
          ./scripts/verify-landing-auth.sh "${base%/}"
